name: Android CI/CD

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode keystore
      run: |
        if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "${{ github.workspace }}/release.keystore"
        fi

    - name: Build release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
      env:
        KEYSTORE_FILE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: enigma-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        body: |
          ## EN!GMA 2.4.3 @可丽饼

          - 修复 R8 混淆导致 OOBE 搜索学校报网络错误（补 Gson TypeToken keep 规则，搜索失败原因透传 UI）
          - 主界面与 OOBE 支持四角连点隐藏手势豁免卡号校验
          - 2.4.3 为 @可丽饼 产线的修复与功能版本
        fail_on_unmatched_files: true
